<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: only light;
      }
      body {
        margin: 0;
        background: #ffffff;
        color: #111111;
        font-family: "Nunito", "Avenir Next", "Avenir", sans-serif;
      }
      main {
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 56px 20px 32px;
      }
      .content {
        text-align: center;
        max-width: 780px;
      }
      .content img {
        width: min(260px, 70vw);
        height: auto;
        margin: 0 auto 24px;
        display: block;
      }
      .content h1 {
        margin: 0 0 12px;
        font-size: 2.1rem;
        letter-spacing: 0.04em;
      }
      .content p {
        margin: 0;
        font-size: 1.1rem;
        line-height: 1.5;
      }
      .content ul,
      .content ol {
        margin: 18px auto;
        padding-left: 1.2em;
        text-align: left;
        display: inline-block;
      }
      .content li {
        margin: 0 0 8px;
      }
      .content li:last-child {
        margin-bottom: 0;
      }
      .content iframe {
        width: 100%;
        height: 420px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        margin: 16px 0 8px;
      }
      .content .btn {
        display: inline-block;
        background: #2a76dd;
        color: #fff;
        text-decoration: none;
        padding: 12px 28px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 1.05rem;
        margin: 8px 6px;
        transition: background 0.15s;
      }
      .content .btn:hover {
        background: #1d5bb8;
      }
      .content .btn-outline {
        background: transparent;
        color: #2a76dd;
        border: 2px solid #2a76dd;
      }
      .content .btn-outline:hover {
        background: #2a76dd;
        color: #fff;
      }
      .content .settings-table {
        margin: 16px auto;
        border-collapse: collapse;
        font-size: 1.05rem;
      }
      .content .settings-table th,
      .content .settings-table td {
        padding: 8px 20px;
        border: 1px solid #ddd;
        text-align: left;
      }
      .content .settings-table th {
        background: #f5f5f5;
        font-weight: 700;
      }
      .content .resource-links {
        list-style: none;
        padding: 0;
        text-align: center;
        display: block;
      }
      .content .resource-links li {
        margin: 10px 0;
      }
      .content .resource-links a {
        color: #2a76dd;
        font-weight: 600;
        text-decoration: none;
      }
      .content .resource-links a:hover {
        text-decoration: underline;
      }
      .content .sponsors-placeholder {
        background: #f9f9f9;
        border: 2px dashed #ddd;
        border-radius: 8px;
        padding: 24px;
        margin: 16px 0;
        color: #888;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="content">
        {{ content }}
      </section>
    </main>
  </body>
</html>
